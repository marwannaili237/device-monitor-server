<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Device Monitor — Admin</title>
<style>
:root{
  --bg:#0a0c10; --bg2:#0f1218; --card:#141821; --card2:#181d28; --line:#232a38;
  --txt:#e6e9ef; --mut:#8b93a3; --dim:#5d6575;
  --acc:#5b8cff; --acc2:#7aa5ff; --ok:#2ed997; --warn:#ffb84d; --err:#ff5d6b; --purple:#a78bfa;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;color:#dfe4ec;font-size:14.5px;line-height:1.5}

/* ============ SIDEBAR (desktop) ============ */
#side{width:230px;min-width:230px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px;font-weight:800;font-size:16px;letter-spacing:.2px;border-bottom:1px solid var(--line);color:#fff}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5b8cff,#7aa5ff);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 14px rgba(91,140,255,.35)}
.brand span{color:#7aa5ff}
#side nav{flex:1;padding:12px 10px;overflow-y:auto}
.sidebtn{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:var(--mut);font-size:14px;font-weight:500;padding:11px 13px;border-radius:10px;cursor:pointer;text-align:left;transition:.15s;margin-bottom:2px}
.sidebtn:hover{background:var(--card);color:#fff}
.sidebtn.on{background:linear-gradient(90deg,rgba(91,140,255,.16),rgba(91,140,255,.04));color:#8fb0ff;font-weight:600}
.sidebtn .ic{width:22px;text-align:center;font-size:16px;opacity:.9}
#side .foot{padding:14px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}
#side .foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 8px rgba(45,217,151,.6)}
#side .foot .dim{font-size:11px;color:var(--dim);margin-top:3px}

/* ---------- MAIN ---------- */
#main{flex:1;min-width:0;padding:26px clamp(14px,4vw,34px) 40px;overflow-x:hidden}
.hidden{display:none!important}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.pagehead h1{font-size:21px;font-weight:800;letter-spacing:-.3px;color:#fff}
.pagehead .sub{color:var(--mut);font-size:13px;margin-top:2px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- KPI cards ---------- */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;position:relative;overflow:hidden}
.kpi .box::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#5b8cff,transparent);opacity:.7}
.kpi .box.g::before{background:linear-gradient(90deg,var(--ok),transparent)}
.kpi .box.r::before{background:linear-gradient(90deg,var(--err),transparent)}
.kpi .box .n{font-size:25px;font-weight:800;color:#fff;letter-spacing:-.5px}
.kpi .box.r .n{color:var(--err)}
.kpi .box.g .n{color:var(--ok)}
.kpi .box .l{font-size:11.5px;color:var(--mut);margin-top:3px;text-transform:uppercase;letter-spacing:.7px}
.kpi .box .hl{position:absolute;top:14px;right:14px;font-size:12px}

/* ---------- cards/tables ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{font-size:12.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.7px;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid rgba(35,43,58,.6);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--bg2)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%}
.pill.on{background:rgba(45,217,151,.12);color:var(--ok)}
.pill.on:before{background:var(--ok);box-shadow:0 0 8px rgba(45,217,151,.8)}
.pill.off{background:rgba(255,184,77,.1);color:var(--warn)}
.pill.off:before{background:var(--warn)}
.pill.rev{background:rgba(255,93,107,.12);color:var(--err)}
.pill.rev:before{background:var(--err)}
.pill.info{background:rgba(91,140,255,.12);color:#9ec0ff}
.pill.info:before{background:#9ec0ff}
.pill.purple{background:rgba(167,139,250,.14);color:var(--purple)}
.pill.purple:before{background:var(--purple)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;background:#3d5ff0;color:#fff;border:none;padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.14s;text-decoration:none;white-space:nowrap}
.btn:hover{background:#3455e7;transform:translateY(-1px)}
.btn:active{transform:none}
.btn .bic{font-size:14px}
.btn.green{background:#17a46f}
.btn.green:hover{background:#13945f}
.btn.red{background:#e3414f}
.btn.red:hover{background:#d33a48}
.btn.ghost{background:none;border:1px solid var(--line);color:#b7bfcc}
.btn.ghost:hover{background:var(--card2);color:#fff;transform:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.full{width:100%;justify-content:center}

/* ---------- device rows (cards) ---------- */
.devicename{font-weight:650;cursor:pointer;color:#cfe0ff;font-size:14.5px}
.devicename:hover{color:#fff;text-decoration:underline}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.dim{color:var(--dim)}
.mut{color:var(--mut)}
.errmsg{background:rgba(255,93,107,.1);border:1px solid rgba(255,93,107,.3);color:#ff9aa3;padding:10px 14px;border-radius:10px;font-size:13px;margin:6px 0}
.okmsg{background:rgba(45,217,151,.08);border:1px solid rgba(45,217,151,.25);color:var(--ok);padding:10px 14px;border-radius:10px;font-size:13px;margin:6px 0}

/* ---------- device detail ---------- */
.backbtn{background:none;border:1px solid var(--line);color:#c7cfdc;width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.backbtn:hover{background:var(--card2);color:#fff}
.tabs{display:flex;gap:4px;margin:14px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:none;color:var(--mut);font-size:13.5px;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.13s}
.tabs button.on{color:#fff;border-bottom-color:var(--accent,#5b8cff)}

/* log viewer */
.pl{background:#0c0f14;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.65;color:#b9c4d4;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:56vh;overflow-y:auto}
.logrow{display:flex;gap:8px;padding:5px 8px;border-radius:6px;font-size:12.5px;font-family:ui-monospace,monospace;color:#b9c4d4;border-bottom:1px solid rgba(35,43,58,.4)}
.logrow:hover{background:var(--bg2)}
.logrow .t{color:var(--accent2,#7aa5ff);min-width:66px}
.logrow .ev{color:var(--purple);min-width:9ch;font-weight:700}
.logrow .pkg{color:var(--warn)}

/* ---------- file rows ---------- */
.crumb{font-size:12.5px;font-family:ui-monospace,monospace;color:#9db2d6;background:var(--bg2);border:1px solid var(--line);padding:8px 12px;border-radius:9px;flex:1;overflow-x:auto;white-space:nowrap}
.frow{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:.12s}
.frow:hover{background:var(--bg2);border-color:var(--line)}
.frow .fic{font-size:16px;width:22px;text-align:center}
.frow .nm{flex:1;font-size:13.5px;font-weight:500;color:#dfe4ec;cursor:pointer}
.frow .meta{color:var(--dim);font-size:12px;min-width:80px;text-align:right}
.frow .act{display:flex;gap:6px}

/* settings opts */
.opt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;font-size:14px;font-weight:650;color:#e8edf5;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
.opt:hover{border-color:#3a4acy;background:var(--card2)}
.opt.on{border-color:rgba(45,217,151,.5);background:rgba(45,217,151,.06)}
.opt .obig{font-size:22px}
.opt .osub{font-size:12.5px;color:var(--dim);font-weight:400}

/* ---------- login ---------- */
#loginBox{background:var(--bg);width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:360px}
.login-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#5b8cff,#7aa5ff);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;box-shadow:0 10px 30px rgba(91,140,255,.4)}
.login-card h1{text-align:center;font-size:21px;font-weight:800;color:#fff;letter-spacing:-.3px}
.login-card .sg{text-align:center;color:var(--dim);font-size:13px;margin:4px 0 24px}
.login-card input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);color:#fff;font-size:14px;outline:none;transition:.15s}
.login-card input:focus{border-color:var(--accent,#5b8cff);box-shadow:0 0 0 3px rgba(91,140,255,.15)}

/* ---------- settings grid ---------- */
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}

/* ---------- bottom nav (mobile) ---------- */
#bottomnav{display:none}
@media(max-width:760px){
  body{flex-direction:column}
  #side{display:none}
  #main{padding:14px 12px 78px;width:100%}
  .kpi{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi .box{padding:12px}
  .kpi .box .n{font-size:21px}
  .bar{width:100%}
  #bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(15,18,24,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:60;padding-bottom:env(safe-area-inset-bottom)}
  #bottomnav button{flex:1;background:none;border:none;color:var(--dim);font-size:9.5px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;letter-spacing:.2px}
  #bottomnav button .ic{font-size:20px;line-height:1}
  #bottomnav button.on{color:var(--acc2,#7aa5ff)}
  #bottomnav button.on .ic{filter:drop-shadow(0 0 8px rgba(91,140,255,.5))}
  #bottomnav button .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);position:absolute;top:6px;margin-left:14px}
  .pagehead{margin-bottom:14px}
  table{font-size:13px}
}
@media(max-width:560px){
  /* responsive table → cards for device list */
  .devtab thead{display:none}
  .devtab, .devtab tbody, .devtab tr, .devtab td{display:block;width:100%}
  .devtab tr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .devtab td{border:none;padding:4px 0}
  .devtab tr:hover{background:var(--card)}
  .devname-row td{font-size:15px}
}
</style>
</head><body>

<!-- login -->
<div id="loginBox" class="login-wrap hidden">
  <div class="login-card">
    <div class="login-logo">🛡</div>
    <h1>Device<span>Monitor</span></h1>
    <div class="sg">Admin console</div>
    <div class="card">
      <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password">
      <button class="btn full" style="margin-top:10px" id="loginBtn" onclick="doLogin()">Sign in</button>
      <div id="loginErr" class="hidden errmsg"></div>
    </div>
  </div>
</div>

<!-- sidebar -->
<div id="side">
  <div class="brand"><div class="logo">🛡</div>Device<span>Monitor</span></div>
  <nav>
    <div class="sidebtn" data-s="overview" onclick="go('overview')"><span class="ic">▦</span><span>Overview</span></div>
    <div class="sidebtn" data-s="devices" onclick="go('devices')"><span class="ic">📱</span><span>Devices</span></div>
    <div class="sidebtn" data-s="audit" onclick="go('audit')"><span class="ic">📜</span><span>Audit Log</span></div>
    <div class="sidebtn" data-s="settings" onclick="go('settings')"><span class="ic">⚙️</span><span>Settings</span></div>
  </nav>
  <div class="foot"><span class="dot"></span><span id="who"></span><div class="dim">Device Monitor console</div></div>
</div>

<div id="main">

  <!-- ================= OVERVIEW ================= -->
  <div id="sec-overview">
    <div class="pagehead"><div><h1>Overview</h1><div class="sub">All devices at a glance</div></div>
      <button class="btn ghost sm" onclick="loadOverview()">↻ Refresh</button></div>
    <div class="kpi" id="kpis"></div>
    <div class="card"><h3>Recent activity</h3><div id="ovRecent" class="dim">Loading…</div></div>
    <div class="card"><h3>⚑ Live devices</h3><div id="ovLive" class="dim">Loading…</div></div>
  </div>

  <!-- ================= DEVICES ================= -->
  <div id="sec-devices" class="hidden">
    <div class="pagehead"><div><h1>Devices</h1><div class="sub" id="devSub">…</div></div>
      <div class="bar"><button class="btn ghost sm" onclick="showAllDevices=!showAllDevices;loadDevices()" id="btnToggleAll">Show all</button>
      <button class="btn sm" onclick="loadDevices()">↻ Refresh</button></div></div>
    <div id="devList"></div>
  </div>

  <!-- ================= DEVICE DETAIL ================= -->
  <div id="sec-device" class="hidden">
    <div class="pagehead">
      <div class="bar">
        <button class="backbtn" onclick="go('devices')" title="Back">‹</button>
        <div style="margin-left:8px"><h1 id="dTitle">Device</h1><div class="sub" id="dStatusLine"></div></div>
      </div>
      <div class="bar">
        <button class="btn ghost sm" onclick="sendAction('sync','Force check-in')">⟳</button>
        <button class="btn sm" onclick="sendAction('beeper','Beep')">🔔 Beep</button>
        <button class="btn sm" onclick="sendAction('lock','Lock')">🔒 Lock</button>
        <button class="btn red sm" onclick="confirmWipe()">🗑 Wipe</button>
      </div>
    </div>
    <div id="dMsg"></div>
    <div class="tabs" id="devTabs">
      <button class="on" data-t="0" onclick="devTab('0')">Info</button>
      <button data-t="1" onclick="devTab('1')">Files</button>
      <button data-t="2" onclick="devTab('2')">Apps</button>
      <button data-t="3" onclick="devTab('3')">Activity</button>
      <button data-t="4" onclick="devTab('4')">Map</button>
      <button data-t="5" onclick="devTab('5')">Audit</button>
    </div>
    <div id="dBody"></div>
  </div>

  <!-- ================= AUDIT ================= -->
  <div id="sec-audit" class="hidden">
    <div class="pagehead"><div><h1>Audit Log</h1><div class="sub">Every action ever taken</div></div>
      <button class="btn ghost sm" onclick="loadAudit()">↻ Refresh</button></div>
    <div class="card"><div id="audBody" class="dim">Loading…</div></div>
  </div>

  <!-- ================= SETTINGS ================= -->
  <div id="sec-settings" class="hidden">
    <div class="pagehead"><div><h1>Settings</h1><div class="sub">Device-wide behavior</div></div></div>
    <div class="card" id="whForm"></div>
  </div>

</div>

<!-- bottom nav -->
<nav id="bottomnav">
  <button data-s="overview" onclick="go('overview')"><span class="ic">▦</span>Overview</button>
  <button data-s="devices" onclick="go('devices')"><span class="ic">📱</span>Devices</button>
  <button data-s="audit" onclick="go('audit')"><span class="ic">📜</span>Audit</button>
  <button data-s="settings" onclick="go('settings')"><span class="ic">⚙️</span>Settings</button>
</nav>

<script>
var token = localStorage.getItem("dm_token") || "";
var cur = null, curTab = "0";
var DEV_BYPASS = true;
var showAllDevices = false;

function el(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
async function api(path, opts){
  opts = opts || {};
  if(opts.body && !(opts.headers && opts.headers["Content-Type"])) opts.headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  opts.headers = Object.assign({"Authorization":"Bearer "+token}, opts.headers || {});
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 30000);
  try{
    const r = await fetch(path, Object.assign({}, opts, {signal:ctrl.signal}));
    if(r.status===401){ token=""; localStorage.removeItem("dm_token"); showLogin(); throw new Error("session expired"); }
    if(r.status===404) throw new Error("not found");
    if(!r.ok){ let m=""; try{ m=JSON.stringify((await r.json()).detail); }catch(e){} throw new Error(m||("HTTP "+r.status)); }
    clearTimeout(t);
    const ct = r.headers.get("content-type")||"";
    return ct.indexOf("json")>=0 ? r.json() : r;
  }catch(e){ throw e; }
}

/* ---------- login ---------- */
async function init(){
  if(DEV_BYPASS && !token){ tryDevAutoLogin(); return; }
  if(!token){ showLogin(); return; }
  try{ const me = await api("/admin/me"); el("who").textContent = (me.role||"admin"); hideLogin(); buildAll(); }
  catch(e){ showLogin(); }
}
function showLogin(){ el("loginBox").classList.remove("hidden"); el("side").classList.add("hidden"); el("bottomnav").classList.add("hidden"); }
function hideLogin(){ el("loginBox").classList.add("hidden"); el("side").classList.remove("hidden"); el("bottomnav").classList.remove("hidden"); }
function doLogin(){
  const b = el("loginBtn"); b.disabled=true; b.textContent="Signing in…";
  fetch("/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pw:el("pw").value})})
  .then(r=>r.json()).then(d=>{
    if(!d.token) throw new Error(d.detail||"login failed");
    token = d.token; localStorage.setItem("dm_token", token);
    el("who").textContent = "root ("+(d.role||"admin")+")";
    hideLogin(); buildAll();
  }).catch(e=>{ const er=el("loginErr"); er.classList.remove("hidden"); er.textContent = e.message; b.disabled=false; b.textContent="Sign in"; });
}
function tryDevAutoLogin(){
  fetch("/admin/devlogin").then(r=>r.json()).then(d=>{
    if(d && d.token){
      token = d.token; localStorage.setItem("dm_token", token);
      el("who").textContent = "root ("+(d.role||"admin")+") (dev)";
      hideLogin(); buildAll();
    } else showLogin();
  }).catch(()=> showLogin());
}
function go(name){
  document.querySelectorAll('.sidebtn, #bottomnav button').forEach(b=>b.classList.toggle('on', b.dataset.s===name));
  if(name==="device" && cur) name="devices";
  ["overview","devices","device","audit","settings"].forEach(s=>el("sec-"+s).classList.toggle("hidden", s!==name));
  el("bottomnav").style.display = (name==="device") ? "none" : "";
  if(name==="overview") loadOverview();
  if(name==="devices") loadDevices();
  if(name==="audit") loadAudit();
  if(name==="settings") loadSettings();
  window.scrollTo(0,0);
}
function buildAll(){ go("overview"); }

/* ---------- overview ---------- */
function kpiRow(x){
  return '<div class="box '+(x.c||"")+'"><div class="n">'+x.n+'</div><div class="l">'+x.l+'</div></div>';
}
function kpiCard(x){
  return '<div class="box '+(x.c||"")+'"><div class="n">'+x.n+'</div><div class="l">'+x.l+'</div></div>';
}
async function loadOverview(){
  try{
    const m = await api("/admin/metrics");
    const k = [
      {n:m.total!=null?m.total:0,l:"Total", c:"b"},
      {n:m.active!=null?m.active:0,l:"Active now", c:m.active?"g":""},
      {n:m.offline!=null?m.offline:0,l:"Offline", c:m.offline?"w":""},
      {n:m.revoked!=null?m.revoked:0,l:"Revoked", c:m.revoked?"r":""},
      {n:m.low_battery!=null?m.low_battery:0,l:"Low battery", c:m.low_battery?"r":""},
      {n:(m.avg_health||0).toFixed(1),l:"Avg health %"},
      {n:(m.free_storage!=null?Math.round(m.free_storage/1024/1024/1024)+" GB":"—"), l:"Storage free"},
    ];
    el("kpis").innerHTML = k.map(kpiCard).join("");
    const rec = (m.recent_audit||[]).slice(0,10);
    el("ovRecent").innerHTML = rec.length
      ? '<table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Device</th><th>Result</th></tr></thead><tbody>'
        + rec.map(a=>'<tr><td class="dim">'+esc((a.ts||"").slice(5,16))+'</td><td>'+esc(a.actor)+'</td><td>'+esc(a.action.replace("command:",""))+'</td><td class="dim mono">'+esc((a.device_id||"").slice(0,8))+'</td><td>'+esc(a.result||"—")+'</td></tr>').join('')
        + '</tbody></table>'
      : '<div class="dim">No activity yet.</div>';
    const d = await api("/admin/devices");
    const all = d.devices||d;
    const act = (all||[]).filter(x=>x.online);
    el("ovLive").innerHTML = act.length
      ? '<table class="devtab"><thead><tr><th>Device</th><th>Status</th><th>Battery</th><th>Last seen</th></tr></thead><tbody>'
        + act.map(x=>'<tr style="cursor:pointer" onclick="openDevice(\''+esc(x.device_id)+'\')"><td><span class="devicename">'+esc(x.label||x.model||x.os_version||x.device_id.slice(0,8))+'</span><div class="dim" style="font-size:11px">'+esc(x.model||"")+' · '+esc(x.device_id.slice(0,8))+'</div></td>'
          + '<td><span class="pill on">LIVE</span></td>'
          + '<td>'+(x.battery_pct!=null?x.battery_pct+"%"+(x.charging?" ⚡":""):"—")+'</td>'
          + '<td class="dim">'+esc((x.last_seen_at||"").slice(5,19))+'</td></tr>').join('')
        + '</tbody></table>'
      : '<div class="dim">No live devices right now.</div>';
  }catch(e){ el("kpis").innerHTML = '<div class="errmsg">'+esc(e.message)+'</div>'; }
}

/* ---------- devices ---------- */
async function loadDevices(){
  el("devSub").textContent = "Loading…";
  try{
    const d = await api("/admin/devices");
    var all = d.devices||d;
    var active = (all||[]).filter(function(x){ return x.online; });
    var list = showAllDevices ? all : active;
    el("devSub").textContent = (list.length||0)+" device"+(list.length===1?"":"s")
      + (showAllDevices ? " shown (all)" : " shown (live only) · "+active.length+" live");
    el("btnToggleAll").textContent = showAllDevices ? "Show live only" : "Show all "+all.length;
    el("devList").innerHTML = '<table class="devtab"><thead><tr><th>Device</th><th>Status</th><th>Battery</th><th>Last seen</th><th></th></tr></thead><tbody>'
      + list.map(x=>{
          const st = x.status;
          const pill = x.online?'<span class="pill on">● LIVE</span>':st==="revoked"?'<span class="pill rev">● REVOKED</span>':'<span class="pill off">○ OFFLINE</span>';
          const id8 = String(x.device_id||"").slice(0,8);
          const name = x.label||x.model||x.os_version||id8;
          return '<tr style="cursor:pointer" onclick="openDevice(\''+esc(x.device_id)+'\')">'
            + '<td><div class="devicename">'+esc(name)+'</div><div class="dim" style="font-size:11px">'+esc(x.model||"unknown model")+' · <span class="mono">'+esc(id8)+'…</span></div></td>'
            + '<td>'+pill+'</td><td>'+(x.battery_pct!=null?x.battery_pct+"%"+(x.charging?" ⚡":""):"—")+'</td>'
            + '<td class="dim">'+esc((x.last_seen_at||"").slice(5,19))+'</td>'
            + '<td style="text-align:right"><button class="btn sm" onclick="event.stopPropagation();openDevice(\''+esc(x.device_id)+'\')">Open →</button></td></tr>';
        }).join('')+'</tbody></table>'
      + (list.length===0 ? '<div class="card dim" style="text-align:center;padding:30px">No '+(showAllDevices?'devices':'live devices')+' right now.</div>' : '');
  }catch(e){ el("devList").innerHTML = '<div class="errmsg">'+esc(e.message)+'</div>'; }
}

function openDevice(id){
  cur = id;
  ["overview","devices"].forEach(s=>el("sec-"+s).classList.add("hidden"));
  el("sec-device").classList.remove("hidden");
  el("bottomnav").style.display = "none";
  el("devTabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.t==="0"));
  loadDeviceDetail(id, "0");
  window.scrollTo(0,0);
}

async function loadDeviceDetail(id, tab){
  el("dBody").innerHTML = '<div class="dim" style="padding:20px;text-align:center">Loading…</div>';
  try{
    const d = await api("/admin/devices/"+encodeURIComponent(id)+"/detail");
    el("dTitle").textContent = esc(d.label||d.model||d.os_version||id.slice(0,8));
    el("dStatusLine").textContent = (d.model||"") + " · Android " + (d.os_version||"") + " · " + (d.status||"");
    renderDeviceTab(d, tab);
  }catch(e){ el("dBody").innerHTML = '<div class="errmsg">'+esc(e.message)+'</div>'; }
}
function devTab(t){
  ["0","1","2","3","4","5"].forEach(x=>el("devTabs").querySelector('button[data-t="'+x+'"]').classList.toggle("on", x===t));
  if(t==="0") loadDeviceDetail(cur,"0");
  else if(t==="1") loadDeviceFilesView();
  else if(t==="2") loadDeviceAppsFromServer();
  else if(t==="3") loadDeviceLogsTab();
  else if(t==="4") loadDeviceMapTab();
  else if(t==="5") loadDeviceAuditTab();
  window.scrollTo(0,0);
}
async function renderDeviceTab(d,t){
  el("dBody").innerHTML = '';
  if(t==="0") el("dBody").innerHTML = infoHtml(d);
  else if(t==="1") loadDeviceFilesView();
  else if(t==="2") loadDeviceAppsView(d);
  else if(t==="3") loadDeviceLogsTab(d);
  else if(t==="4") loadDeviceMapTab();
  else if(t==="5") loadDeviceAuditTab();
}
function infoHtml(d){
  const stor = d.storage_total ? fmtSize(d.storage_free)+" free of "+fmtSize(d.storage_total) : "—";
  const fl = [];
  if(d.rooted) fl.push(['rooted','r']); if(d.unknown_sources) fl.push(['unknown sources','w']); if(d.unlocked_boot) fl.push(['bootloader unlocked','w']);
  return '<div class="card"><h3>Identity</h3><table>'
    + row('Label', d.label||"—") + row('Serial', d.device_id, 'mono')
    + row('Model', d.model||"—") + row('OS','Android '+(d.os_version||"—")+' (SDK '+(d.sdk||"—")+')')
    + row('Manufacturer', d.manufacturer||"—") + row('Security patch', d.security_patch||"—")
    + row('Enrolled', (d.enrolled_at||"").slice(0,19).replace("T"," "), 'dim')
    + '</table></div>'
    + '<div class="card"><h3>Health</h3><table>'
    + row('Battery', d.battery_pct!=null?d.battery_pct+"%"+(d.charging?" ⚡":""):"—")
    + row('Storage', stor)
    + row('Last seen', (d.last_seen_at||"").slice(0,19).replace("T"," "), 'dim')
    + '</table></div>'
    + (fl.length ? '<div class="card"><h3>Flags</h3><div style="display:flex;gap:6px;flex-wrap:wrap">'+fl.map(f=>'<span class="pill" style="'+ (f[1]==='r'?'background:rgba(255,93,107,.12);color:#ff5d6b':'background:rgba(255,184,77,.1);color:#ffb84d') +'">⚑ '+f[0]+'</span>').join('')+'</div></div>' : '');
}
function row(k,v,cls){ return '<tr><td class="mut" style="width:38%">'+k+'</td><td class="'+(cls||'')+'">'+esc(v)+'</td></tr>'; }

/* ================= FILES ================= */
var filePath = "/sdcard";
function loadDeviceFilesView(){
  el("dBody").innerHTML = ''
    + '<div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">'
    + '<button class="btn sm ghost" onclick="fileUp()">⬆</button>'
    + '<div class="crumb">'+esc(filePath)+'</div>'
    + '<button class="btn sm ghost" onclick="fileBrowse()">↻</button>'
    + '<button class="btn sm green" onclick="filePush()">▲ Push</button>'
    + '<button class="btn sm green" onclick="fileInstall()">▲ APK</button>'
    + '</div><div id="fileList" style="min-height:80px"></div></div>'
    + '<div class="dim" style="font-size:12px">Tap a folder to open it · tap a file to download it.</div>';
  fileBrowse();
}
function fileUp(){ const p=filePath; if(p.indexOf("/")<0) return; filePath = p.slice(0,p.lastIndexOf("/")); if(!filePath) filePath="/sdcard"; loadDeviceFilesView(); }
async function fileBrowse(){
  try{ await api("/admin/devices/"+encodeURIComponent(cur)+"/files?path="+encodeURIComponent(filePath)); setTimeout(()=>fileList(), 2500); }
  catch(e){ fileList(new Error(e.message)); }
}
async function fileList(er){
  const list = el("fileList"); if(!list) return;
  if(er){ list.innerHTML = '<div class="errmsg">'+esc(er.message)+'</div>'; return; }
  try{
    const r = await fetch("/admin/devices/"+encodeURIComponent(cur)+"/files/content?path="+encodeURIComponent(filePath), {headers:{"Authorization":"Bearer "+token}});
    if(!r.ok){
      if(r.status===404){ list.innerHTML = '<div class="dim">No listing for this folder yet — the device only uploads folders it has scanned. If the device is on, tap ↻ Refresh.</div>'; return; }
      throw new Error("HTTP "+r.status);
    }
    const txt = await r.text();
    let data = txt;
    try{ data = JSON.parse(txt); }catch(e){}
    let items = Array.isArray(data) ? data : (data.files||[]);
    list.innerHTML = items.length ? items.map(f=>{
      const isDir = f.type==="dir" || (f.name && !String(f.name).includes("."));
      const click = isDir ? "fileOpen('"+esc(f.name)+"')" : "fileDownload('"+esc(f.path)+"')";
      return '<div class="frow"><span class="fic">'+(isDir?"📁":"📄")+'</span>'
        + '<span class="nm" onclick="'+click+'">'+esc(String(f.name||f.path||"?"))+'</span>'
        + '<span class="meta">'+(isDir?"":(f.size!=null?fmtSize(f.size):""))+'</span>'
        + (isDir?'':'<span class="act"><button class="btn sm" onclick="fileDownload(\''+esc(f.path)+'\')">⬇</button></span>')
        + '</div>';
    }).join('') : '<div class="dim">Empty folder — or device hasn\'t answered yet, hit ↻ Refresh.</div>';
  }catch(e){ list.innerHTML = '<div class="errmsg">'+esc(e.message)+'</div>'; }
}
function fileOpen(name){ filePath = filePath.replace(/\/+$/,"")+"/"+name; loadDeviceFilesView(); }
async function fileDownload(path){
  try{
    const r = await fetch("/admin/devices/"+encodeURIComponent(cur)+"/files/download?path="+encodeURIComponent(path), {headers:{"Authorization":"Bearer "+token}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download = path.split("/").pop(); a.click();
    flash("Downloaded");
  }catch(e){ flash("Download: "+e.message, true); }
}
async function filePush(){
  const p = prompt("Destination folder on device:","/sdcard/Download"); if(p==null) return;
  const inp = document.createElement("input"); inp.type="file";
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    const fd = new FormData(); fd.append("path", p.replace(/\/+$/,"")+"/"+f.name); fd.append("content", f);
    flash("Uploading…");
    try{ await api("/admin/devices/"+encodeURIComponent(cur)+"/files/push", {method:"POST", body: fd}); flash("Pushed — device accepts on next check-in."); }
    catch(e){ flash("Push failed: "+e.message, true); }
  };
  inp.click();
}
async function fileInstall(){
  const inp = document.createElement("input"); inp.type="file"; inp.accept=".apk,application/vnd.android.package-archive";
  inp.onchange = async ()=>{
    const apk = inp.files[0]; if(!apk) return;
    const fd = new FormData(); fd.append("content", apk);
    flash("Uploading APK…");
    try{ await api("/admin/devices/"+encodeURIComponent(cur)+"/apps/install", {method:"POST", body: fd}); flash("APK sent — install prompt appears on device."); }
    catch(e){ flash("Install failed: "+e.message, true); }
  };
  inp.click();
}
function flash(msg, isErr){
  const m = el("dMsg"); if(!m) return;
  m.className = isErr?"errmsg":"okmsg";
  m.textContent = msg;
  setTimeout(()=>{m.className="hidden"}, 6000);
}

/* ================= APPS ================= */
async function loadDeviceAppsFromServer(){
  el("dBody").innerHTML = '<div class="dim" style="padding:20px;text-align:center">Loading…</div>';
  try{ const d = await api("/admin/devices/"+encodeURIComponent(cur)+"/detail"); loadDeviceAppsView(d); }
  catch(e){ el("dBody").innerHTML = '<div class="errmsg">'+esc(e.message)+'</div>'; }
}
async function loadDeviceAppsView(d){
  el("dBody").innerHTML = '<div style="margin-bottom:12px" class="bar">'
    + '<button class="btn sm" onclick="refreshApps()">↻ Refresh apps</button>'
    + '<button class="btn sm green" onclick="fileInstall()">📦 Push & install APK…</button></div>'
    + '<div id="appsList"></div>';
  const apps = d.apps || [];
  el("appsList").innerHTML = apps.length
    ? '<div class="card"><table><thead><tr><th>App</th><th>Package</th><th></th></tr></thead><tbody>'
      + apps.map(a=>'<tr><td>'+esc(a.label||"—")+'</td><td class="dim mono">'+esc(a.package)+'</td>'
        + '<td style="text-align:right"><button class="btn sm red" onclick="uninstallApp(\''+esc(a.package)+'\',\''+esc(a.label||a.package)+'\')">🗑 Uninstall</button></td></tr>').join('')
      + '</tbody></table></div>'
    : '<div class="dim">No apps reported yet.</div>';
}
async function refreshApps(){
  try{ await api("/admin/devices/"+encodeURIComponent(cur)+"/command", {method:"POST", body: JSON.stringify({cmd:"apps"})}); flash("Asking device to resend its app list…"); }
  catch(e){ flash(e.message, true); }
}
async function uninstallApp(pkg, label){
  if(!confirm("Uninstall "+label+" ("+pkg+")?")) return;
  try{ await api("/admin/devices/"+encodeURIComponent(cur)+"/apps/uninstall", {method:"POST", body: JSON.stringify({package:pkg})}); flash("Uninstall requested — confirm on device."); }
  catch(e){ flash("Uninstall failed: "+e.message, true); }
}

/* ================= ACTIVITY / KEYSTROKES ================= */
async function loadDeviceLogsTab(d){ // d optional
  el("dBody").innerHTML = '<div class="dim" style="padding:20px;text-align:center">Loading logs…</div>';
  try{
    const l = await api("/admin/devices/"+encodeURIComponent(cur)+"/logs");
    var dates = [];
    if(Array.isArray(l)) dates = l;
    else if(Array.isArray(l.logs)) dates = l.logs.map(function(x){ return typeof x==="string" ? x : (x.log_date||x.date||x); });
    else if(Array.isArray(l.dates)) dates = l.dates;
    dates = dates.filter(function(x){ return /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(String(x)); });
    dates.sort().reverse();
    if(!dates.length){
      el("dBody").innerHTML = '<div class="card" style="text-align:center;padding:26px"><div style="font-size:34px;margin-bottom:10px">📭</div><b>No activity captured yet</b><div class="dim" style="margin-top:6px">The daily keystroke/activity log hasn\'t uploaded.<br>On the phone: re-enable the Accessibility service (Work Monitor → Accessibility → ON), then type anything — it lands here within a minute.</div></div>';
      return;
    }
    el("dBody").innerHTML = '<div class="card"><h3>Activity log</h3><div style="display:flex;gap:8px;flex-wrap:wrap">'
      + dates.map(function(dt){ return '<button class="btn sm ghost" onclick="viewLogDay('+JSON.stringify(String(dt))+')">📅 '+esc(String(dt))+'</button>'; }).join('')
      + '</div></div><div id="logDay"></div>';
    if(dates.length === 1) viewLogDay(String(dates[0]));
  }catch(e){ el("dBody").innerHTML = '<div class="errmsg">'+esc(e.message)+'</div>'; }
}
async function viewLogDay(dt){
  const box = el("logDay"); if(!box) return;
  box.innerHTML = '<div class="card"><h3>'+esc(dt)+'</h3><pre class="pl">Loading…</pre></div>';
  try{
    const r = await fetch("/admin/devices/"+encodeURIComponent(cur)+"/logs/"+encodeURIComponent(dt)+"/content", {headers:{"Authorization":"Bearer "+token}});
    const txt = r.ok ? await r.text() : "no content";
    box.innerHTML = '<div class="card"><h3>'+esc(dt)+' <button class="btn sm ghost" style="float:right" onclick="logDownloadDay('+String(dt)+')">⬇ Download</button></h3><pre class="pl">'+esc(txt)+'</pre></div>';
  }catch(e){ box.innerHTML = '<div class="errmsg">'+esc(e.message)+'</div>'; }
}
async function logDownloadDay(dt){
  const r = await fetch("/admin/devices/"+encodeURIComponent(cur)+"/logs/"+encodeURIComponent(dt)+"/content", {headers:{"Authorization":"Bearer "+token}});
  if(!r.ok) return;
  const blob = await r.blob();
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download = cur.slice(0,8)+"-"+dt+".log"; a.click();
}

/* ================= LOCATION ================= */
async function loadDeviceMapTab(){
  el("dBody").innerHTML = '<div class="card"><h3>Location</h3><div id="locBox" class="dim">Loading…</div></div>'
    + '<div><button class="btn" onclick="forceLocate()">📍 Locate now</button></div>';
  try{
    const l = await api("/admin/devices/"+encodeURIComponent(cur)+"/locations");
    const pts = l.locations || l;
    if(pts.length){
      const last = pts[pts.length-1];
      el("locBox").innerHTML = '<div class="dim" style="margin-bottom:10px">Last fix: '+esc((last.ts||"").slice(0,19).replace("T"," "))+'</div>'
        + '<iframe style="width:100%;height:320px;border:none;border-radius:10px" src="https://www.openstreetmap.org/export/embed.html?bbox='+(last.lng-0.004)+'%2C'+(last.lat-0.002)+'%2C'+(last.lng+0.004)+'%2C'+(last.lat+0.002)+'&amp;layer=mapnik&amp;marker='+last.lat+'%2C'+last.lng+'"></iframe>'
        + '<div class="dim" style="margin-top:8px" class="mono">'+last.lat+', '+last.lng+'</div>';
    } else el("locBox").textContent = "No location fixes yet.";
  }catch(e){ el("locBox").innerHTML = '<div class="errmsg">'+esc(e.message)+'</div>'; }
}
async function forceLocate(){
  try{ await api("/admin/devices/"+encodeURIComponent(cur)+"/command", {method:"POST", body: JSON.stringify({cmd:"sync"})}); flash("Location sync requested…"); }
  catch(e){ flash(e.message, true); }
}

/* ================= DEVICE AUDIT ================= */
async function loadDeviceAuditTab(){
  try{
    const a = await api("/admin/audit?device_id="+encodeURIComponent(cur));
    const items = a.items || a;
    el("dBody").innerHTML = items && items.length ? '<div class="card"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Result</th><th>Reason</th></tr></thead><tbody>'
      + items.map(x=>'<tr><td class="dim">'+esc((x.ts||"").slice(5,19).replace("T"," "))+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.action.replace("command:",""))+'</td><td>'+esc(x.result||"—")+'</td><td class="dim">'+esc(x.reason||"—")+'</td></tr>').join('')
      + '</tbody></table></div>' : '<div class="card dim">No actions for this device yet.</div>';
  }catch(e){ el("dBody").innerHTML = '<div class="errmsg">'+esc(e.message)+'</div>'; }
}

/* ================= DEVICE ACTIONS ================= */
async function sendAction(act, label, needsConfirm){
  if(needsConfirm && !confirm(label+" on "+cur.slice(0,8)+"?")) return;
  const m = el("dMsg");
  m.className=""; m.textContent="Sending…";
  try{ await api("/admin/devices/"+encodeURIComponent(cur)+"/"+act, {method:"POST", body:"{}"}); flash(label+" sent — device reacts on next check-in."); }
  catch(e){ flash(label+": "+(e&&e.message?e.message:JSON.stringify(e)), true); }
}
function confirmWipe(){
  if(!confirm("⚠️ WIPE this device — factory reset, ALL data erased?")) return;
  if(!confirm("Are you absolutely sure? This cannot be undone.")) return;
  sendAction("wipe","Wipe");
}

/* ================= GLOBAL AUDIT ================= */
async function loadAudit(){
  el("audBody").innerHTML = '<div class="dim" style="padding:14px">Loading…</div>';
  try{
    const a = await api("/admin/audit");
    const items = a.items || a;
    el("audBody").innerHTML = items && items.length ? '<table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Device</th><th>Result</th><th>Reason</th></tr></thead><tbody>'
      + items.map(x=>'<tr><td class="dim">'+esc((x.ts||"").slice(5,19).replace("T"," "))+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.action.replace("command:",""))+'</td><td class="dim mono">'+esc((x.device_id||"").slice(0,8))+'</td><td>'+esc(x.result||"—")+'</td><td class="dim">'+esc(x.reason||"—")+'</td></tr>').join('')
      + '</tbody></table>' : '<div class="dim">No actions recorded yet.</div>';
  }catch(e){ el("audBody").innerHTML = '<div class="errmsg">'+esc(e.message)+'</div>'; }
}

/* ================= SETTINGS ================= */
function optCard(big, title, sub, onclick){
  return '<button class="opt" onclick="'+onclick+'"><span class="biig">'+big+'</span><span>'+title+'</span><span class="osub">'+sub+'</span></button>';
}
async function loadSettings(){
  el("whForm").innerHTML = '<div class="dim">Loading…</div>';
  try{
    const s = await api("/admin/settings");
    const wh = s.work_hours || {};
    const active = wh.active || String(s.work_active||"").trim()==="1";
    el("whForm").innerHTML = '<div class="optgrid">'
      + '<button class="opt '+(active?"on":"")+'" onclick="toggleSetting(\'work_active\','+(active?0:1)+')"><span class="biig">🕘</span><span>Work hours gating</span><span class="osub">'+((active?"On — location only in work hours":"Off — always record location"))+'</span></button>'
      + '<button class="opt" onclick="flash(\'Coming soon: automatic install of approved APKs\')"><span class="biig">📦</span><span>Silent install</span><span class="osub">Coming soon</span></button>'
      + '<button class="opt" onclick="flash(\'Coming soon: kiosk lock a device\')"><span class="biig">🔐</span><span>Kiosk mode</span><span class="osub">Coming soon</span></button>'
      + '<button class="opt" onclick="flash(\'Coming soon: geofence alerts\')"><span class="biig">📍</span><span>Geofence alerts</span><span class="osub">Coming soon</span></button>'
      + '<button class="opt" onclick="flash(\'Coming soon: require a password on the device\')"><span class="biig">🔑</span><span>Password policy</span><span class="osub">Coming soon</span></button>'
      + '</div>';
  }catch(e){ el("whForm").innerHTML = '<div class="errmsg">'+esc(e.message)+'</div>'; }
}
async function toggleSetting(k,v){
  try{ await api("/admin/settings", {method:"POST", body: JSON.stringify({[k]: String(v)})}); loadSettings(); }
  catch(e){ flash(e.message, true); }
}

/* ================= HELPERS ================= */
function fmtSize(b){
  if(b==null) return ""; if(b<1024) return b+"B";
  const u=["KB","MB","GB","TB"]; let i=-1; do{ b/=1024; i++; }while(b>=1024 && i<u.length-1);
  return b.toFixed(1)+u[i];
}
init();
</script>
</body></html>
